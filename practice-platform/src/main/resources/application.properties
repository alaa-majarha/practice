spring.application.name=SoapApplication
server.port=8081
#camel.main.run-controller=true




#jms connection properties
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=artemis
spring.artemis.password=artemis

#oracle
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ee.oracle.docker
spring.datasource.username=practice
spring.datasource.password=practice
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

#mcp prop
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=my-mcp-server
spring.ai.mcp.server.version=1.0.0
#github (optional, raises rate limit to 5000/h)
github.token=${GITHUB_TOKEN:}
